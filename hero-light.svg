<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Cao Longyang, AI agent engineer">
  <title>Cao Longyang — AI agent engineer</title>
  <desc>An animated banner: the name and role on the left, and on the right a small agent graph whose nodes light up while pulses travel along its edges.</desc>

  <style>
    .bg      { fill: #FFFFFF; }
    .grid    { fill: #DDE4EC; }
    .rule    { stroke: #0969DA; stroke-width: 2; stroke-dasharray: 240; stroke-dashoffset: 240; animation: draw 1.1s ease-out .35s forwards; }
    .overline{ fill: #0969DA; font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 3.4px; opacity: 0; animation: rise .7s ease-out .15s forwards; }
    .name    { fill: #1F2328; font: 600 41px/1 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; letter-spacing: -.8px; opacity: 0; animation: rise .8s ease-out .28s forwards; }
    .tag     { fill: #59636E; font: 400 14px/1 ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; opacity: 0; animation: rise .8s ease-out .55s forwards; }
    .meta    { fill: #8B949E; font: 400 11px/1 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1.1px; opacity: 0; animation: rise .8s ease-out .72s forwards; }

    .edge    { stroke: #D7DEE6; stroke-width: 1; fill: none; }
    .edge-hi { stroke: #9CC4E8; stroke-width: 1.2; fill: none; opacity: .9; }

    .core    { fill: #FFFFFF; stroke: #0969DA; stroke-width: 1.4; }
    .core-s  { fill: #FFFFFF; stroke: #A8C7E8; stroke-width: 1.2; }

    .halo    { fill: #0969DA; opacity: 0; transform-box: fill-box; transform-origin: center; animation: halo 3.6s ease-out infinite; }
    .halo-2  { animation-delay: 1.2s; }
    .halo-3  { animation-delay: 2.4s; }

    .pulse   { fill: #0969DA; opacity: 0; }
    .p-ab    { animation: p-ab 3.2s linear infinite; }
    .p-ac    { animation: p-ac 3.2s linear infinite 1.1s; }
    .p-bd    { animation: p-bd 3.2s linear infinite .6s; }
    .p-ad    { animation: p-ad 3.6s linear infinite 1.9s; }

    .dot     { fill: #1A7F37; opacity: 0; animation: rise .6s ease-out 1s forwards; }

    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes rise { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes halo {
      0%   { opacity: 0;   transform: scale(.6); }
      12%  { opacity: .26; transform: scale(1); }
      38%  { opacity: 0;   transform: scale(1.7); }
      100% { opacity: 0;   transform: scale(1.7); }
    }
    @keyframes p-ab {
      0%   { opacity: 0; transform: translate(0,0); }
      6%   { opacity: 1; }
      30%  { opacity: 1; transform: translate(90px,-64px); }
      36%  { opacity: 0; transform: translate(90px,-64px); }
      100% { opacity: 0; transform: translate(90px,-64px); }
    }
    @keyframes p-ac {
      0%   { opacity: 0; transform: translate(0,0); }
      6%   { opacity: 1; }
      30%  { opacity: 1; transform: translate(104px,72px); }
      36%  { opacity: 0; transform: translate(104px,72px); }
      100% { opacity: 0; transform: translate(104px,72px); }
    }
    @keyframes p-bd {
      0%   { opacity: 0; transform: translate(0,0); }
      6%   { opacity: 1; }
      30%  { opacity: 1; transform: translate(104px,36px); }
      36%  { opacity: 0; transform: translate(104px,36px); }
      100% { opacity: 0; transform: translate(104px,36px); }
    }
    @keyframes p-ad {
      0%   { opacity: 0; transform: translate(0,0); }
      7%   { opacity: 1; }
      34%  { opacity: 1; transform: translate(194px,-28px); }
      40%  { opacity: 0; transform: translate(194px,-28px); }
      100% { opacity: 0; transform: translate(194px,-28px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .rule, .overline, .name, .tag, .meta, .dot { animation: none; opacity: 1; stroke-dashoffset: 0; }
      .halo, .pulse { animation: none; opacity: 0; }
    }
  </style>

  <rect class="bg" width="880" height="240"/>
  <rect x="0.5" y="0.5" width="879" height="239" fill="none" stroke="#E4E9EF"/>

  <g class="grid">
    <circle cx="48"  cy="24"  r="1"/><circle cx="88"  cy="24"  r="1"/><circle cx="128" cy="24"  r="1"/><circle cx="168" cy="24"  r="1"/><circle cx="208" cy="24"  r="1"/><circle cx="248" cy="24"  r="1"/><circle cx="288" cy="24"  r="1"/><circle cx="328" cy="24"  r="1"/><circle cx="368" cy="24"  r="1"/><circle cx="408" cy="24"  r="1"/><circle cx="448" cy="24"  r="1"/><circle cx="488" cy="24"  r="1"/><circle cx="528" cy="24"  r="1"/><circle cx="568" cy="24"  r="1"/><circle cx="608" cy="24"  r="1"/><circle cx="648" cy="24"  r="1"/><circle cx="688" cy="24"  r="1"/><circle cx="728" cy="24"  r="1"/><circle cx="768" cy="24"  r="1"/><circle cx="808" cy="24"  r="1"/><circle cx="848" cy="24"  r="1"/>
    <circle cx="48"  cy="216" r="1"/><circle cx="88"  cy="216" r="1"/><circle cx="128" cy="216" r="1"/><circle cx="168" cy="216" r="1"/><circle cx="208" cy="216" r="1"/><circle cx="248" cy="216" r="1"/><circle cx="288" cy="216" r="1"/><circle cx="328" cy="216" r="1"/><circle cx="368" cy="216" r="1"/><circle cx="408" cy="216" r="1"/><circle cx="448" cy="216" r="1"/><circle cx="488" cy="216" r="1"/><circle cx="528" cy="216" r="1"/><circle cx="568" cy="216" r="1"/><circle cx="608" cy="216" r="1"/><circle cx="648" cy="216" r="1"/><circle cx="688" cy="216" r="1"/><circle cx="728" cy="216" r="1"/><circle cx="768" cy="216" r="1"/><circle cx="808" cy="216" r="1"/><circle cx="848" cy="216" r="1"/>
  </g>

  <text class="overline" x="48" y="70">AI AGENT ENGINEER</text>
  <text class="name" x="46" y="120">Cao Longyang</text>
  <line class="rule" x1="48" y1="142" x2="288" y2="142"/>
  <text class="tag" x="48" y="172">I build agents that read, decide, and act.</text>
  <text class="meta" x="48" y="205">UNIVERSITI MALAYA · KUALA LUMPUR</text>

  <g>
    <line class="edge" x1="596" y1="120" x2="686" y2="56"/>
    <line class="edge" x1="596" y1="120" x2="700" y2="192"/>
    <line class="edge" x1="686" y1="56"  x2="790" y2="92"/>
    <line class="edge-hi" x1="596" y1="120" x2="790" y2="92"/>
    <line class="edge" x1="700" y1="192" x2="812" y2="176"/>
    <line class="edge" x1="790" y1="92"  x2="812" y2="176"/>

    <circle class="halo halo-2" cx="596" cy="120" r="13"/>
    <circle class="halo" cx="686" cy="56" r="7"/>
    <circle class="halo halo-3" cx="790" cy="92" r="9"/>

    <circle class="pulse p-ab" cx="596" cy="120" r="2.4"/>
    <circle class="pulse p-ac" cx="596" cy="120" r="2.4"/>
    <circle class="pulse p-bd" cx="686" cy="56"  r="2.4"/>
    <circle class="pulse p-ad" cx="596" cy="120" r="2.2"/>

    <circle class="core" cx="596" cy="120" r="13"/>
    <circle class="core-s" cx="686" cy="56"  r="7"/>
    <circle class="core-s" cx="700" cy="192" r="7"/>
    <circle class="core-s" cx="790" cy="92"  r="9"/>
    <circle class="core-s" cx="812" cy="176" r="6"/>

    <circle cx="596" cy="120" r="4" fill="#0969DA"/>
    <circle class="dot" cx="686" cy="56"  r="2.6"/>
    <circle class="dot" cx="790" cy="92"  r="3.2"/>
  </g>
</svg>
